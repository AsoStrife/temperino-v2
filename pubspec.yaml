name: temperino
description: "Temperino – diario delle attività di coppia (Flutter, Android)."
publish_to: 'none'

# version: <versionName>+<versionCode>
# - versionName must match AppConfig.appVersion (lib/core/config/app_config.dart).
# - versionCode must be greater than the last one uploaded to Google Play.
version: 2.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  fl_chart: ^1.3.1
  shared_preferences: ^2.5.6
  intl: ^0.20.3

dev_dependencies:
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Launcher icon: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets-src/web-icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#33BEF9"
  adaptive_icon_foreground: "assets-src/web-icon.png"
  adaptive_icon_foreground_inset: 16

# Native splash: `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#FFFBFF"
  color_dark: "#1A1110"
  image: "assets-src/web-icon.png"
  android_12:
    color: "#FFFBFF"
    color_dark: "#1A1110"
    image: "assets-src/web-icon.png"
  ios: false
  web: false
